# solarized light
#
# Ethan Schoonover's canonical light variant: the sixteen accent colors are
# identical to Solarized Dark, only the eight monotones are reversed. base3
# (#fdf6e3) is a warm paper, not white, so it has no glare.

[colors]
cursor = { text = "#fdf6e3", cursor = "#657b83" }
vi_mode_cursor = { text = "#fdf6e3", cursor = "#6c71c4" }
line_indicator = { background = "#eee8d5", foreground = "#657b83" }
footer_bar = { background = "#eee8d5", foreground = "#657b83" }
selection = { text = "#586e75", background = "#eee8d5" }

[colors.primary]
background = "#fdf6e3"
foreground = "#657b83"
dim_foreground = "#839496"
bright_foreground = "#586e75"

[colors.search]
matches = { foreground = "#fdf6e3", background = "#b58900" }
focused_match = { foreground = "#fdf6e3", background = "#cb4b16" }

[colors.normal]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#eee8d5"

[colors.bright]
black = "#002b36"
red = "#cb4b16"
green = "#586e75"
yellow = "#657b83"
blue = "#839496"
magenta = "#6c71c4"
cyan = "#93a1a1"
white = "#fdf6e3"

[colors.dim]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#93a1a1"
