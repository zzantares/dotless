setw -g clock-mode-style

# To enable truecolors in Vim
set -sa terminal-overrides ',xterm-256color:RGB'

# Let programs forward escape sequences to the outer terminal (e.g. the `t`
# script emits an OSC to WezTerm to switch workspaces from inside tmux).
set -g allow-passthrough on

# Window navigation
bind C-b last-window
bind b last-window
bind g switch-client -l
# Jump to the last pane if the window has splits, otherwise fall back to the
# last window. Fixes "No last pane" when each window has only one pane.
bind t if -F "#{>:#{window_panes},1}" last-pane last-window
bind c new-window -c "#{pane_current_path}"
unbind M-c

# Same as `C-t w` but focuses sessions first instead of windows
bind-key Space choose-tree -s

# Window splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# More vi-like visual selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-k send-keys -X scroll-down
bind-key -T copy-mode-vi C-h send-keys -X scroll-up
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-[ send-keys -X cancel

bind-key -T copy-mode-vi k send-keys -X cursor-down
bind-key -T copy-mode-vi h send-keys -X cursor-up
bind-key -T copy-mode-vi j send-keys -X cursor-left
bind-key -T copy-mode-vi l send-keys -X cursor-right

bind-key -T choose-tree h send-keys up
bind-key -T choose-tree k send-keys down
bind-key -T choose-tree j send-keys left
bind-key -T choose-tree l send-keys right

bind-key -T menu h send-keys up
bind-key -T menu k send-keys down

bind-key -r h select-pane -U
bind-key -r k select-pane -D
bind-key -r j select-pane -L
bind-key -r l select-pane -R

bind -r H resize-pane -U 5
bind -r K resize-pane -D 5
bind -r J resize-pane -L 5
bind -r L resize-pane -R 5

######################## THEME CUSTOMIZATION ########################

# NOTE: you can use vars with $<var> and ''${<var>} as long as the str is double quoted: ""
# WARNING: hex colors can't contain capital letters

# --> Catppuccin
thm_bg="#1e1e28"
thm_fg="#dadae8"
thm_cyan="#c2e7f0"
thm_black="#15121c"
thm_gray="#332e41"
thm_magenta="#c6aae8"
thm_pink="#e5b4e2"
thm_red="#e38c8f"
thm_green="#b1e3ad"
thm_yellow="#ebddaa"
thm_blue="#a4b9ef"
thm_orange="#f9c096"
thm_black4="#575268"

# ----------------------------=== Utilities ===--------------------------

# Session picker with attention markers — bind to prefix + o (or any key)
#
# NOTE If you want to filter to only Claude-related sessions, you could adopt a
# naming convention (e.g., prefix Claude worktree sessions with claude-) and
# then filter:
#
#     bind o choose-tree -sF "#{?@claude_attention,● ,  }#{session_name} (#{session_windows} windows)" -f "#{m:claude-*,#{session_name}}"
#
# The -f flag filters to only sessions matching claude-*. But honestly, showing
# all sessions is probably fine — the ● marker makes it clear which ones need
# attention, and you can still use the picker as a general session switcher.
bind O choose-tree -sF "#{?@claude_attention,● ,  }#{session_name} (#{session_windows} windows)"

# Auto-clear the attention flag when you switch to a session
set-hook -g client-session-changed "set-option -q @claude_attention 0"

# Refresh status bar every 5 seconds
set -g status-interval 5

# ----------------------------=== Theme ===--------------------------

# status
set -g status-position bottom
set -g status "on"
set -g status-bg "$thm_bg"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# messages
set -g message-style fg="$thm_cyan",bg="$thm_gray",align="centre"
set -g message-command-style fg="$thm_cyan",bg="$thm_gray",align="centre"

# panes
set -g pane-border-style fg="$thm_gray"
set -g pane-active-border-style fg="$thm_blue"

# windows
setw -g window-status-activity-style fg="$thm_fg",bg="$thm_bg",none
setw -g window-status-separator ""
setw -g window-status-style fg="$thm_fg",bg="$thm_bg",none


# --------=== Statusline

set -g status-left "#[fg=$thm_green,bg=$thm_gray] #S " # show the current session name on the status bar

set -g status-right "#[fg=$thm_pink,bg=$thm_bg,nobold,nounderscore,noitalics]#[fg=$thm_bg,bg=$thm_pink,nobold,nounderscore,noitalics] #[fg=$thm_fg,bg=$thm_gray] #W %H:%M #{?client_prefix,#[fg=$thm_red],#[fg=$thm_green]}#[bg=$thm_gray]#{?client_prefix,#[bg=$thm_red],#[bg=$thm_green]}#[fg=$thm_bg] #[fg=$thm_fg,bg=$thm_gray] #S "


setw -g window-status-format "#[fg=$thm_bg,bg=$thm_blue] #I #[fg=$thm_fg,bg=$thm_gray] #{?window_name,#{b:window_name},#{b:pane_current_command}} "
setw -g window-status-current-format "#[fg=$thm_bg,bg=$thm_orange] #I #[fg=$thm_fg,bg=$thm_bg] #{?window_name,#{b:window_name},#{b:pane_current_command}} "


# --------=== Modes
setw -g clock-mode-colour "$thm_blue"
setw -g mode-style "fg=$thm_pink bg=$thm_black4 bold"
