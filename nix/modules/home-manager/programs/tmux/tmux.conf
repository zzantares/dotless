setw -g clock-mode-style

# Truecolor for every client, not just xterm-256color: charm TUIs read the
# RGB flag out of `tmux info`. The linux console has none.
set -sa terminal-overrides ',*:RGB,linux*:RGB@'

# Let programs forward escape sequences to the outer terminal (e.g. the `t`
# script emits an OSC to WezTerm to switch workspaces from inside tmux).
set -g allow-passthrough on

# Window navigation
bind C-b last-window
bind b last-window
bind g switch-client -l
# Jump to the last pane if the window has splits, otherwise fall back to the
# last window. Fixes "No last pane" when each window has only one pane.
bind t if -F "#{>:#{window_panes},1}" last-pane last-window
bind c new-window -c "#{pane_current_path}"
unbind M-c

# Same as `C-t w` but focuses sessions first instead of windows
bind-key Space choose-tree -s

# Window splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# More vi-like visual selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-k send-keys -X scroll-down
bind-key -T copy-mode-vi C-h send-keys -X scroll-up
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-[ send-keys -X cancel

bind-key -T copy-mode-vi k send-keys -X cursor-down
bind-key -T copy-mode-vi h send-keys -X cursor-up
bind-key -T copy-mode-vi j send-keys -X cursor-left
bind-key -T copy-mode-vi l send-keys -X cursor-right

bind-key -T choose-tree h send-keys up
bind-key -T choose-tree k send-keys down
bind-key -T choose-tree j send-keys left
bind-key -T choose-tree l send-keys right

bind-key -T menu h send-keys up
bind-key -T menu k send-keys down

bind-key -r h select-pane -U
bind-key -r k select-pane -D
bind-key -r j select-pane -L
bind-key -r l select-pane -R

bind -r H resize-pane -U 5
bind -r K resize-pane -D 5
bind -r J resize-pane -L 5
bind -r L resize-pane -R 5

# ----------------------------=== Utilities ===--------------------------

# Session picker with attention markers — bind to prefix + o (or any key)
#
# NOTE If you want to filter to only Claude-related sessions, you could adopt a
# naming convention (e.g., prefix Claude worktree sessions with claude-) and
# then filter:
#
#     bind o choose-tree -sF "#{?@claude_attention,● ,  }#{session_name} (#{session_windows} windows)" -f "#{m:claude-*,#{session_name}}"
#
# The -f flag filters to only sessions matching claude-*. But honestly, showing
# all sessions is probably fine — the ● marker makes it clear which ones need
# attention, and you can still use the picker as a general session switcher.
bind O choose-tree -sF "#{?@claude_attention,● ,  }#{session_name} (#{session_windows} windows)"

# Auto-clear the attention flag when you switch to a session
set-hook -g client-session-changed "set-option -q @claude_attention 0"

# Refresh status bar every 5 seconds
set -g status-interval 5

# The palette and every style that uses it live in theme-{dark,light}.conf,
# generated by the tmux module and re-sourced on an appearance change.
source-file -q ~/.config/tmux/theme-active.conf
