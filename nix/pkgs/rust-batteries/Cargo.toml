# Crates kept available offline. Not a real package: this manifest exists only
# so Cargo.lock pins a dependency set, which importCargoLock turns into a
# vendor directory. Add a crate here, then run `just rust-batteries`.
[package]
name = "rust-batteries"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
bincode = "3"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.8"
csv = "1"
futures = "0.3"
hyper = { version = "1", features = ["full"] }
hyper-util = "0.1"
indexmap = "2"
itertools = "0.15"
parking_lot = "0.12"
proptest = "1"
rand = "0.10"
rayon = "1"
regex = "1"
reqwest = { version = "0.13", features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
