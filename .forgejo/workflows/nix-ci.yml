name: Nix CI

on:
  push:
    branches:
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  pull_request:
    branches:
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  workflow_dispatch:

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: nix fmt
    runs-on: nix
    permissions:
      contents: read
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://x-token-auth:${GITHUB_TOKEN}@git.gutimore.net/gutimore/dotless.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Check formatting
        run: nix fmt -- --ci

  # dotless is a library flake (modules, presets, overlays), so it exposes no
  # full homeConfigurations to evaluate. We still gate the outputs we can:
  # evaluate every overlay package's derivation path with `abort-on-warn`,
  # which turns `builtins.warn` (what nixpkgs deprecations now use) into a hard
  # error. Evaluating `.drvPath` forces evaluation without building, so this is
  # side-effect-free and safe on PRs.
  #
  # This covers the overlay and pkgs/ warnings at the source. The preset and
  # module warnings only surface once a consumer instantiates a full config —
  # dotfiles' own `warnings` job (which evaluates homeConfigurations.antares)
  # is that integration gate, and it fires on the PR that bumps dotless. See
  # issue #45 to add a preset smoke-test config here for source-level coverage.
  warnings:
    name: eval warnings
    needs: fmt
    runs-on: nix
    permissions:
      contents: read
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://x-token-auth:${GITHUB_TOKEN}@git.gutimore.net/gutimore/dotless.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Evaluate overlay packages, fail on any warning
        run: |
          set -euo pipefail
          pkgs=(
            claude-code
            opencode
            fonts
            wallpapers
            linear-cli
            zed-editor
          )
          for p in "${pkgs[@]}"; do
            echo "==> eval $p"
            nix eval --impure --raw ".#packages.x86_64-linux.$p.drvPath" \
              --option abort-on-warn true >/dev/null
          done
