name: Nix CI

on:
  push:
    branches:
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  pull_request:
    branches:
      - master
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  workflow_dispatch:

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: nix fmt
    runs-on: nix
    permissions:
      contents: read
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://x-token-auth:${GITHUB_TOKEN}@git.gutimore.net/gutimore/dotless.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Check formatting
        run: nix fmt -- --ci

  # Fail on any eval warning: eval each smoke config's drvPath under
  # abort-on-warn (nixpkgs deprecations use builtins.warn; drvPath forces eval,
  # no build). fail-fast: false so a failure names the offending config.
  warnings:
    name: Warnings ${{ matrix.name }}
    needs: fmt
    runs-on: nix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: smoke-home,  attr: .#checks.x86_64-linux.smoke-home.drvPath }
          - { name: smoke-nixos, attr: .#checks.x86_64-linux.smoke-nixos.drvPath }
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "https://x-token-auth:${GITHUB_TOKEN}@git.gutimore.net/gutimore/dotless.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Evaluate ${{ matrix.name }}, fail on any warning
        run: nix eval --impure --raw ${{ matrix.attr }} --option abort-on-warn true >/dev/null
